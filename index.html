<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Детектор повторов</title>
<style>
  :root[data-theme="light"] {
    --bg: #f7f8fa; --panel-bg: #ffffff; --text: #1a1a1a; --text-muted: #6b7280;
    --border: #e5e7eb; --accent: #2563eb; --accent-hover: #1d4ed8;
    --popup-bg: #ffffff; --shadow: 0 8px 24px rgba(0,0,0,0.12);
    --syn-bg: #eff6ff; --syn-border: #bfdbfe; --syn-hover: #dbeafe;
    --header-bg: #f1f5f9;
  }
  :root[data-theme="dark"] {
    --bg: #0f172a; --panel-bg: #1e293b; --text: #e2e8f0; --text-muted: #94a3b8;
    --border: #334155; --accent: #3b82f6; --accent-hover: #60a5fa;
    --popup-bg: #1e293b; --shadow: 0 8px 24px rgba(0,0,0,0.5);
    --syn-bg: #1e3a5f; --syn-border: #1e40af; --syn-hover: #1e40af;
    --header-bg: #0f172a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    transition: background 0.2s, color 0.2s;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; background: var(--panel-bg);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
    flex-wrap: wrap; gap: 8px;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .btn {
    padding: 8px 12px; font-size: 13px; border-radius: 8px;
    cursor: pointer; border: 1px solid var(--border);
    background: var(--panel-bg); color: var(--text);
    transition: all 0.15s; white-space: nowrap; font-family: inherit;
  }
  .btn:hover { border-color: var(--accent); }
  .btn-primary {
    background: var(--accent); color: #fff; border-color: var(--accent);
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-danger:hover { border-color: #ef4444; color: #ef4444; }
  .theme-toggle {
    width: 40px; height: 40px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; border-radius: 50%;
  }
  .slider-wrap {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 12px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px;
    font-size: 13px;
  }
  .slider-wrap label { color: var(--text-muted); white-space: nowrap; }
  .slider-wrap input[type=range] { width: 100px; accent-color: var(--accent); }
  .slider-val {
    font-weight: 600; min-width: 20px; text-align: center;
    color: var(--accent);
  }
  .workspace {
    display: grid; grid-template-columns: 1fr 360px;
    gap: 16px; padding: 16px; max-width: 1500px; margin: 0 auto;
  }
  @media (max-width: 900px) {
    .workspace { grid-template-columns: 1fr; padding: 12px; gap: 12px; }
  }
  .editor-pane { display: flex; flex-direction: column; gap: 10px; }
  textarea {
    width: 100%; min-height: 140px; padding: 12px;
    font-size: 15px; line-height: 1.6;
    border: 1px solid var(--border); border-radius: 12px;
    background: var(--panel-bg); color: var(--text);
    resize: vertical; font-family: inherit; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  .preview {
    padding: 14px; font-size: 16px; line-height: 2;
    border: 1px solid var(--border); border-radius: 12px;
    background: var(--panel-bg); min-height: 150px;
    word-wrap: break-word;
  }
  .repeat {
    border-radius: 3px; padding: 1px 4px;
    cursor: pointer; border-bottom: 2px solid transparent;
    font-weight: 500;
  }
  .side-pane {
    background: var(--panel-bg); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px;
    display: flex; flex-direction: column;
    max-height: 80vh; overflow-y: auto;
  }
  @media (max-width: 900px) { .side-pane { max-height: none; } }
  .side-pane h2 {
    font-size: 13px; font-weight: 600; margin: 0 0 10px 0;
    text-transform: uppercase; letter-spacing: 0.5px;
    color: var(--text-muted);
  }
  .empty-state {
    color: var(--text-muted); font-size: 14px;
    text-align: center; padding: 30px 16px; line-height: 1.6;
  }
  .repeat-card {
    border: 1px solid var(--border); border-left-width: 6px;
    border-radius: 8px; padding: 10px 12px; margin-bottom: 8px;
    cursor: pointer; transition: transform 0.15s;
  }
  .repeat-card:hover { transform: translateX(2px); }
  .repeat-card .card-head {
    font-weight: 600; font-size: 14px; margin-bottom: 6px;
    display: flex; justify-content: space-between;
    align-items: center; gap: 6px; flex-wrap: wrap;
  }
  .repeat-card .card-type {
    font-size: 10px; font-weight: 500; padding: 2px 6px;
    border-radius: 4px; background: var(--bg); color: var(--text-muted);
    white-space: nowrap;
  }
  .repeat-card .occurrence {
    font-size: 13px; color: var(--text-muted);
    margin: 4px 0; line-height: 1.4; padding-left: 4px;
    word-wrap: break-word;
  }
  .repeat-card .occurrence mark {
    background: transparent; color: var(--text);
    font-weight: 600; padding: 0 2px; border-radius: 2px;
  }
  #synonym-popup {
    position: fixed; display: none;
    background: var(--popup-bg); border: 1px solid var(--border);
    border-radius: 10px; box-shadow: var(--shadow);
    padding: 12px; min-width: 220px;
    max-width: calc(100vw - 24px); z-index: 1000;
  }
  #synonym-popup h4 {
    margin: 0 0 8px 0; font-size: 13px;
    color: var(--text-muted); font-weight: 500;
  }
  #synonym-popup .syn-list {
    display: flex; flex-wrap: wrap; gap: 6px;
  }
  #synonym-popup .syn-item {
    padding: 6px 10px; background: var(--syn-bg);
    border: 1px solid var(--syn-border); border-radius: 6px;
    cursor: pointer; font-size: 14px; color: var(--text);
  }
  #synonym-popup .syn-item:hover { background: var(--syn-hover); }
  #synonym-popup .syn-add {
    border-style: dashed; opacity: 0.7;
  }
  #synonym-popup .loading,
  #synonym-popup .empty { color: var(--text-muted); font-size: 13px; }
  .stats { font-size: 12px; color: var(--text-muted); margin-left: 8px; }
  .warn { color: #f59e0b; font-size: 11px; margin-left: 6px; }
  #toast {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--accent); color: #fff;
    padding: 10px 18px; border-radius: 8px;
    font-size: 14px; opacity: 0; transition: all 0.3s;
    z-index: 2000; pointer-events: none;
  }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>

<header>
  <div style="display:flex; align-items:center; flex-wrap:wrap; gap:6px;">
    <h1>🔍 Детектор повторов</h1>
    <span class="stats" id="stats"></span>
    <span class="warn" id="stem-warn" style="display:none;">⚠️ упрощённый стеммер</span>
  </div>
  <div class="controls">
    <div class="slider-wrap">
      <label for="distance">Через</label>
      <input type="range" id="distance" min="1" max="15" value="4">
      <span class="slider-val" id="distance-val">4</span>
      <label>слов</label>
    </div>
    <button class="btn btn-primary" id="btn-check" type="button">Проверить</button>
    <button class="btn" id="btn-copy" type="button">📋</button>
    <button class="btn btn-danger" id="btn-clear" type="button">🗑</button>
    <button class="btn theme-toggle" id="btn-theme" type="button">🌙</button>
  </div>
</header>

<div class="workspace">
  <div class="editor-pane">
    <textarea id="input" placeholder="Вставь текст…">Мы пришли в магазин, в магазине было много сладостей. Кот сидел на окне. Кот смотрел на улицу. Собака бежала. Маша захотела вату. Собака лаяла.</textarea>
    <div class="preview" id="preview"></div>
  </div>
  <aside class="side-pane">
    <h2>Найдено повторов</h2>
    <div id="repeats-list"></div>
  </aside>
</div>

<div id="synonym-popup">
  <h4 id="popup-word"></h4>
  <div class="syn-list" id="popup-list"></div>
</div>

<div id="toast"></div>

<script>
/* ============================================================
   SNOWBALL RUSSIAN STEMMER (встроенный)
   ============================================================ */
var RussianStemmer = function() {
  var vowel = /[аеиоуыэюя]/;
  var perfectiveground = /(ив|ивши|ившись|ыв|ывши|ывшись)$/;
  var reflexive = /(с[яьи])$/;
  var adjective = /(ими|ій|ый|ой|ий|ая|яя|ое|ее|ые|ие|ому|ему|ого|его|ому|ім|ым|им|ыми|ьми|ий|ій|ий|ой|ый|ого|ому|ыми|ых|іх|ых|ую|юю|ая|яя|ою|ею)$/;
  var participle1 = /(ем|нн|вш|ющ|щ|ивш|ывш)$/;
  var participle2 = /(ую|юю|ая|яя|ою|ею)$/;
  var verb = /(ла|на|ете|йте|ли|й|л|ем|н|ло|но|ет|ют|ны|ть|ешь|нно|его|ему|ому|ій|ый|ой|ий|ая|яя|ое|ее|ые|ие|ому|его|ого|ему)$/;
  var noun = /(а|ев|ов|е|иями|ями|ами|еи|ии|и|ией|ей|ой|ий|й|иям|ям|ием|ем|ам|ом|о|у|ах|иях|ях|ы|ь|ию|ью|ю|ия|ья|я)$/;
  var superlative = /(ейш|ейше)$/;
  var derivational = /(ост|ость)$/;
  var i = /и$/;
  var softsign = /ь$/;

  function stemWord(word) {
    var w = word.toLowerCase().replace(/ё/g, 'е');
    if (w.length < 3) return w;

    var RV = w.length;
    for (var j = 0; j < w.length; j++) {
      if (vowel.test(w[j])) {
        var k = j + 1;
        while (k < w.length && vowel.test(w[k])) k++;
        if (k < w.length && !vowel.test(w[k])) {
          RV = k + 1;
          break;
        }
      }
    }

    var beforeRV = w.substring(0, RV);
    var rv = w.substring(RV);

    if (perfectiveground.test(rv)) {
      rv = rv.replace(perfectiveground, '');
    } else if (reflexive.test(rv)) {
      rv = rv.replace(reflexive, '');
      if (adjective.test(rv)) {
        rv = rv.replace(adjective, '');
        rv = rv.replace(participle1, '');
      } else if (participle1.test(rv)) {
        rv = rv.replace(participle1, '');
        if (participle2.test(rv)) rv = rv.replace(participle2, '');
      } else if (verb.test(rv)) {
        rv = rv.replace(verb, '');
      } else if (noun.test(rv)) {
        rv = rv.replace(noun, '');
      }
    } else {
      if (adjective.test(rv)) {
        rv = rv.replace(adjective, '');
        rv = rv.replace(participle1, '');
      } else if (participle1.test(rv)) {
        rv = rv.replace(participle1, '');
        if (participle2.test(rv)) rv = rv.replace(participle2, '');
      } else if (verb.test(rv)) {
        rv = rv.replace(verb, '');
      } else if (noun.test(rv)) {
        rv = rv.replace(noun, '');
      }
    }

    var result = beforeRV + rv;
    if (i.test(result)) {
      var rv2 = result.substring(RV);
      if (rv2.length > 1) result = result.slice(0, -1);
    }
    if (softsign.test(result)) result = result.slice(0, -1);
    return result;
  }

  return { stemWord: stemWord };
};

/* ============================================================
   КЛЮЧИ СЛОВА: стемм + "обрубок" первых 5 букв
   ============================================================ */
// Обрубок ловит однокоренные слова разных частей речи:
// «работники» → работ, «работали» → работ → совпадают.
const STUB_LENGTH = 5;

function getWordKeys(word) {
  const lower = word.toLowerCase().replace(/ё/g, 'е');
  const keys = new Set();

  // 1) Полный стемм через Snowball
  if (snowballStemmer) {
    try {
      const stem = snowballStemmer.stemWord(lower);
      if (stem.length >= 3) keys.add(stem);
    } catch (e) {}
  }

  // 2) Обрубок: первые 5 букв (если слово длиннее 5)
  if (lower.length > STUB_LENGTH) {
    keys.add('stub:' + lower.slice(0, STUB_LENGTH));
  }

  // 3) Fallback-стеммер (на случай, если Snowball не сработал)
  if (keys.size === 0) {
    keys.add(simpleRussianStem(lower));
  }

  return [...keys];
}

/* ============================================================
   ВСТРОЕННЫЙ СТЕММЕР (fallback)
   ============================================================ */
function simpleRussianStem(word) {
  let w = word.toLowerCase().replace(/ё/g, 'е');
  if (w.length <= 4) return w;
  const endings = [
    'иями','иях','иям','ией','аться','яться','иться','еться','ываться',
    'иваться','уется','ается','яется','ится','ется','ать','ять','ить',
    'еть','уть','ыть','ает','яет','ует','ают','яют','уют','ала','яла',
    'ила','ела','ула','ыла','али','яли','или','ели','ули','ыли','ал',
    'ял','ил','ел','ул','ыл','аю','яю','ую','юю','ай','яй','уй','ой',
    'ей','ая','яя','ое','ее','ые','ие','ый','ий','ым','им','ем','ом',
    'ам','ям','ах','ях','ов','ев','ую','юю','ия','ие','ии','ями','ами',
    'у','ю','а','я','о','е','ы','и','й','ь'
  ];
  for (const end of endings) {
    if (w.length - end.length >= 4 && w.endsWith(end)) {
      return w.slice(0, -end.length);
    }
  }
  return w;
}

/* ============================================================
   ОСНОВНОЙ КОД
   ============================================================ */
(function() {
  'use strict';

  const $ = id => document.getElementById(id);
  const input       = $('input');
  const preview     = $('preview');
  const repeatsList = $('repeats-list');
  const statsEl     = $('stats');
  const popup       = $('synonym-popup');
  const popupWord   = $('popup-word');
  const popupList   = $('popup-list');
  const toastEl     = $('toast');
  const themeBtn    = $('btn-theme');
  const stemWarn    = $('stem-warn');
  const distanceEl  = $('distance');
  const distanceVal = $('distance-val');

  /* ============ ТЕМА ============ */
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    themeBtn.textContent = theme === 'light' ? '🌙' : '☀️';
  }
  function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'light' ? 'dark' : 'light';
    applyTheme(next);
    try { localStorage.setItem('theme', next); } catch (e) {}
    safeAnalyze();
  }
  let savedTheme = 'light';
  try { savedTheme = localStorage.getItem('theme') || 'light'; } catch (e) {}
  applyTheme(savedTheme);

  /* ============ ПАЛИТРА ============ */
  const COLORS_LIGHT = [
    { bg: '#fde68a', border: '#f59e0b' },
    { bg: '#bbf7d0', border: '#22c55e' },
    { bg: '#bfdbfe', border: '#3b82f6' },
    { bg: '#fecaca', border: '#ef4444' },
    { bg: '#e9d5ff', border: '#a855f7' },
    { bg: '#fed7aa', border: '#f97316' },
    { bg: '#a5f3fc', border: '#06b6d4' },
    { bg: '#fbcfe8', border: '#ec4899' },
  ];
  const COLORS_DARK = [
    { bg: '#78350f', border: '#f59e0b' },
    { bg: '#14532d', border: '#22c55e' },
    { bg: '#1e3a8a', border: '#3b82f6' },
    { bg: '#7f1d1d', border: '#ef4444' },
    { bg: '#4c1d95', border: '#a855f7' },
    { bg: '#7c2d12', border: '#f97316' },
    { bg: '#164e63', border: '#06b6d4' },
    { bg: '#831843', border: '#ec4899' },
  ];
  function getPairColor(index) {
    const theme = document.documentElement.getAttribute('data-theme');
    const palette = theme === 'dark' ? COLORS_DARK : COLORS_LIGHT;
    return palette[index % palette.length];
  }

  /* ============ СТЕММЕР ============ */
  let snowballStemmer = null;
  try {
    snowballStemmer = RussianStemmer();
  } catch (e) {}
  if (!snowballStemmer) stemWarn.style.display = 'inline';

  /* ============ СТОП-СЛОВА ============ */
  const STOP_WORDS = new Set([
    'и','в','во','не','что','он','на','я','с','со','как','а','то','все','она',
    'так','его','но','да','ты','к','у','же','вы','за','бы','по','только','ее',
    'мне','было','вот','от','меня','еще','нет','о','из','ему','теперь','когда',
    'даже','ну','вдруг','ли','если','уже','или','ни','быть','был','него','до',
    'вас','нибудь','опять','уж','вам','ведь','там','потом','себя','ничего','ей',
    'может','они','тут','где','есть','надо','ней','для','мы','тебя','их','чем',
    'была','сам','чтоб','без','будто','чего','раз','тоже','себе','под','будет',
    'ж','тогда','кто','этот','того','потому','этого','какой','совсем','ним',
    'здесь','этом','один','почти','мой','тем','чтобы','нее','сейчас','были',
    'куда','зачем','всех','никогда','можно','при','наконец','два','об','другой',
    'хоть','после','над','больше','тот','через','эти','нас','про','всего','них',
    'какая','много','разве','три','эту','моя','впрочем','хорошо','свою','этой',
    'перед','иногда','лучше','чуть','том','нельзя','такой','им','более','всегда',
    'конечно','всю','между'
  ]);

  /* ============ ЗАГОЛОВКИ ============ */
  function isHeadingLine(line) {
    const t = line.trim();
    if (/^#{1,6}\s/.test(t)) return true;
    if (/^\*{1,2}[^*].*\*{1,2}$/.test(t)) return true;
    return false;
  }

  /* ============ ТОКЕНИЗАЦИЯ ============ */
  function tokenize(text) {
    const tokens = [];
    const lines = text.split('\n');
    lines.forEach((line, lineIdx) => {
      if (lineIdx > 0) tokens.push({ type: 'punct', text: '\n' });
      const isHead = isHeadingLine(line);
      const parts = line.split(/([а-яёa-z]+)/i);
      for (const part of parts) {
        if (!part) continue;
        if (/^[а-яёa-z]+$/i.test(part)) {
          tokens.push({
            type: 'word',
            text: part,
            keys: getWordKeys(part),
            isHeading: isHead
          });
        } else {
          tokens.push({ type: 'punct', text: part });
        }
      }
    });
    return tokens;
  }

  /* ============ УТИЛИТЫ ============ */
  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
  function escapeAttr(str) { return escapeHtml(str); }

  /* ============ ТОСТ ============ */
  let toastTimer = null;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2000);
  }

  /* ============ СОСТОЯНИЕ ============ */
  let currentTokens = [];
  let currentPairs = [];
  const synonymCache = new Map();

  /* ============ АНАЛИЗ ============ */
  function safeAnalyze() {
    try { analyze(); }
    catch (e) {
      console.error('Ошибка анализа:', e);
      statsEl.textContent = '⚠️ Ошибка: ' + e.message;
    }
  }

  function analyze() {
    const text = input.value;
    hidePopup();
    if (!text.trim()) {
      preview.innerHTML = '';
      repeatsList.innerHTML = '<div class="empty-state">Введите текст.</div>';
      statsEl.textContent = '';
      currentPairs = [];
      currentTokens = [];
      return;
    }

    const distance = parseInt(distanceEl.value, 10) || 4;
    const tokens = tokenize(text);
    currentTokens = tokens;

    // Теперь у каждого слова МАССИВ ключей (стемм + обрубок).
    // Ищем пересечения ключей между словами.
    // keyToOccurrences: ключ → список вхождений { tokenIdx, word, keys }
    const keyToOccurrences = new Map();

    tokens.forEach((t, idx) => {
      if (t.type !== 'word') return;
      if (t.text.length < 4) return;              // короче 4 букв не трогаем
      if (STOP_WORDS.has(t.text.toLowerCase())) return;
      if (t.isHeading) return;
      for (const key of t.keys) {
        if (!keyToOccurrences.has(key)) keyToOccurrences.set(key, []);
        keyToOccurrences.get(key).push({ tokenIdx: idx, word: t.text, keys: t.keys });
      }
    });

    // Для каждого ключа — если встретился ≥2 раз на близком расстоянии,
    // помечаем ВСЕ вхождения этого ключа как повтор.
    // Одно слово может попасть в несколько пар — это ок.
    const markedTokens = new Map(); // tokenIdx → Set<key>

    function markToken(tokenIdx, key) {
      if (!markedTokens.has(tokenIdx)) markedTokens.set(tokenIdx, new Set());
      markedTokens.get(tokenIdx).add(key);
    }

    for (const [key, occs] of keyToOccurrences) {
      if (occs.length < 2) continue;

      // Ищем пары на расстоянии ≤ distance
      const closeIdx = new Set();
      for (let i = 0; i < occs.length; i++) {
        for (let j = i + 1; j < occs.length; j++) {
          const d = countWordsBetween(tokens, occs[i].tokenIdx, occs[j].tokenIdx);
          if (d <= distance) {
            closeIdx.add(i);
            closeIdx.add(j);
          }
        }
      }
      if (closeIdx.size >= 2) {
        for (const i of closeIdx) {
          markToken(occs[i].tokenIdx, key);
        }
      }
    }

    // Группируем помеченные токены по ключам в "пары" для панели
    // Считаем: одна "пара" = один ключ, у которого ≥2 помеченных вхождений.
    // Но чтобы не дублировать («работники» помечены ключами «работник» и «stub:работ»),
    // объединяем вхождения по tokenIdx.
    const pairsFound = [];
    const usedTokenIdxs = new Set();
    let colorIdx = 0;

    // Итерируем ключи в порядке появления
    const sortedKeys = [...markedTokens.entries()]
      .sort((a, b) => {
        const aMin = Math.min(...a[1]);
        return aMin - Math.min(...b[1]);
      });

    // Соберём уникальные группы: tokenIdx → keys[] уже есть.
    // Для панели возьмём "главный" ключ (без stub:), если есть.
    const alreadyGrouped = new Set();

    for (const [tokenIdx, keys] of sortedKeys) {
      if (alreadyGrouped.has(tokenIdx)) continue;

      // Найдём все токены, связанные с этими ключами
      const group = new Set([tokenIdx]);
      for (const k of keys) {
        const occs = keyToOccurrences.get(k) || [];
        for (const o of occs) group.add(o.tokenIdx);
      }

      // Помечаем группу
      const groupArr = [...group].sort((a, b) => a - b);
      for (const g of groupArr) alreadyGrouped.add(g);

      // Главный ключ для отображения
      let mainKey = null;
      for (const k of keys) {
        if (!k.startsWith('stub:')) { mainKey = k; break; }
      }
      if (!mainKey) mainKey = [...keys][0];

      pairsFound.push({
        stem: mainKey.replace(/^stub:/, ''),
        colorIndex: colorIdx++,
        occurrences: groupArr.map(idx => ({
          tokenIdx: idx,
          word: tokens[idx].text
        }))
      });
    }

    currentPairs = pairsFound;

    // Карта tokenIdx → colorIndex
    const tokenToColor = new Map();
    pairsFound.forEach(p => {
      p.occurrences.forEach(o => tokenToColor.set(o.tokenIdx, p.colorIndex));
    });

    renderPreview(tokens, tokenToColor);
    renderRepeatsList(pairsFound, tokens);

    statsEl.textContent = pairsFound.length === 0
      ? 'Повторов не найдено ✅'
      : `Пар повторов: ${pairsFound.length}`;
  }

  function countWordsBetween(tokens, a, b) {
    if (a > b) [a, b] = [b, a];
    let count = 0;
    for (let i = a + 1; i < b; i++) {
      if (tokens[i].type === 'word') count++;
    }
    return count;
  }

  function renderPreview(tokens, tokenToColor) {
    let html = '';
    for (let i = 0; i < tokens.length; i++) {
      const t = tokens[i];
      if (t.type === 'punct') {
        html += t.text === '\n' ? '<br>' : escapeHtml(t.text);
        continue;
      }
      const colorIdx = tokenToColor.get(i);
      if (colorIdx !== undefined) {
        const color = getPairColor(colorIdx);
        html += `<span class="repeat"
                       style="background:${color.bg};border-bottom-color:${color.border}"
                       data-token-idx="${i}"
                       data-word="${escapeAttr(t.text)}"
                       data-stem="${escapeAttr(t.keys[0] || '')}">${escapeHtml(t.text)}</span>`;
      } else {
        html += escapeHtml(t.text);
      }
    }
    preview.innerHTML = html;
    preview.querySelectorAll('.repeat').forEach(el => {
      el.addEventListener('click', onWordClick);
    });
  }

  function renderRepeatsList(pairs, tokens) {
    if (pairs.length === 0) {
      repeatsList.innerHTML = '<div class="empty-state">✅<br><br>Повторов не найдено</div>';
      return;
    }
    repeatsList.innerHTML = pairs.map(pair => {
      const color = getPairColor(pair.colorIndex);
      const occurrencesHtml = pair.occurrences.map(occ => {
        const t = tokens[occ.tokenIdx];
        const snippet = getContext(tokens, occ.tokenIdx);
        return `<div class="occurrence">
          <mark style="background:${color.bg}">${escapeHtml(t.text)}</mark>
          <span style="opacity:0.7">… ${escapeHtml(snippet)}</span>
        </div>`;
      }).join('');
      return `<div class="repeat-card"
                    style="border-left-color:${color.border};background:${color.bg}22"
                    data-token-idx="${pair.occurrences[0].tokenIdx}">
        <div class="card-head">
          <span>${escapeHtml(pair.stem)}</span>
          <span class="card-type">${pair.occurrences.length}×</span>
        </div>
        ${occurrencesHtml}
      </div>`;
    }).join('');

    repeatsList.querySelectorAll('.repeat-card').forEach(card => {
      card.addEventListener('click', () => {
        const tokenIdx = parseInt(card.dataset.tokenIdx, 10);
        const target = preview.querySelector(`.repeat[data-token-idx="${tokenIdx}"]`);
        if (target) {
          target.scrollIntoView({ behavior: 'smooth', block: 'center' });
          const prev = target.style.outline;
          target.style.outline = '3px solid var(--accent)';
          setTimeout(() => { target.style.outline = prev; }, 1000);
        }
      });
    });
  }

  function getContext(tokens, tokenIdx) {
    let left = '', right = '';
    let li = tokenIdx - 1, lcount = 0;
    while (li >= 0 && lcount < 3) {
      if (tokens[li].type === 'word') lcount++;
      left = tokens[li].text + left;
      li--;
    }
    let ri = tokenIdx + 1, rcount = 0;
    while (ri < tokens.length && rcount < 3) {
      if (tokens[ri].type === 'word') rcount++;
      right += tokens[ri].text;
      ri++;
    }
    return left.trim() + '…' + right.trim();
  }

  /* ============ ВСТРОЕННЫЙ СЛОВАРЬ ============ */
  const BUILTIN_SYNONYMS = {
    'магазин': ['лавка', 'лабаз', 'супермаркет', 'универмаг', 'торговая точка'],
    'кот': ['кошка', 'котёнок', 'мурлыка', 'васька'],
    'собака': ['пёс', 'псина', 'щенок', 'дворняга', 'собачка'],
    'идти': ['шагать', 'двигаться', 'направляться', 'следовать', 'ступать'],
    'говорить': ['сказать', 'молвить', 'произносить', 'изрекать', 'вещать'],
    'красивый': ['прекрасный', 'великолепный', 'восхитительный', 'изящный'],
    'большой': ['огромный', 'громадный', 'крупный', 'гигантский', 'значительный'],
    'маленький': ['крошечный', 'мелкий', 'небольшой', 'миниатюрный', 'малый'],
    'быстрый': ['скорый', 'стремительный', 'резвый', 'проворный', 'молниеносный'],
    'хотеть': ['желать', 'жаждать', 'мечтать', 'стремиться'],
    'дом': ['жилище', 'обитель', 'кров', 'жильё', 'здание'],
    'человек': ['индивид', 'личность', 'персона', 'гражданин', 'субъект'],
    'работа': ['труд', 'дело', 'занятие', 'деятельность', 'служба'],
    'друг': ['приятель', 'товарищ', 'напарник', 'соратник', 'знакомый'],
    'важный': ['значимый', 'существенный', 'ключевой', 'принципиальный'],
    'хороший': ['славный', 'отличный', 'превосходный', 'достойный', 'добротный'],
    'плохой': ['скверный', 'дурной', 'негодный', 'отвратительный'],
    'сильный': ['мощный', 'крепкий', 'могучий', 'стойкий', 'выносливый'],
    'слабый': ['немощный', 'хрупкий', 'бессильный', 'вялый', 'хилый'],
  };

  /* ============ СЛОВАРЬ АБРАМОВА ============ */
  let abramovDict = null;

  async function loadAbramovDictionary() {
    try {
      const res = await fetch('./dictionary.json');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      abramovDict = new Map();
      for (const entry of (data.wordlist || [])) {
        if (entry.name && entry.synonyms && entry.synonyms.length > 0) {
          abramovDict.set(entry.name.toLowerCase(), entry.synonyms);
        }
      }
      console.log('Словарь Абрамова загружен:', abramovDict.size, 'слов');
    } catch (e) {
      console.warn('Словарь Абрамова не загрузился:', e.message);
    }
  }

  function getAbramovSynonyms(word) {
    if (!abramovDict) return [];
    return abramovDict.get(word.toLowerCase()) || [];
  }

  /* ============ ПОЛЬЗОВАТЕЛЬСКИЕ СИНОНИМЫ ============ */
  function loadUserSynonyms() {
    try {
      const raw = localStorage.getItem('userSynonyms');
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  }
  function saveUserSynonym(word, synonym) {
    try {
      const data = loadUserSynonyms();
      const key = word.toLowerCase();
      if (!data[key]) data[key] = [];
      if (!data[key].includes(synonym)) data[key].push(synonym);
      localStorage.setItem('userSynonyms', JSON.stringify(data));
    } catch (e) {}
  }
  function getUserSynonymsFor(word) {
    const data = loadUserSynonyms();
    return data[word.toLowerCase()] || [];
  }

  /* ============ ПОИСК СИНОНИМОВ ============ */
  async function fetchSynonyms(stem, word) {
    const results = new Set();

    getAbramovSynonyms(word).forEach(s => results.add(s));
    (BUILTIN_SYNONYMS[word.toLowerCase()] || []).forEach(s => results.add(s));
    getUserSynonymsFor(word).forEach(s => results.add(s));

    try {
      const url = `https://api.datamuse.com/words?rel_syn=${encodeURIComponent(stem)}&max=15`;
      const res = await fetch(url);
      const data = await res.json();
      data.forEach(item => results.add(item.word));
    } catch (e) {}

    try {
      const url = `https://api.datamuse.com/words?ml=${encodeURIComponent(stem)}&max=15`;
      const res = await fetch(url);
      const data = await res.json();
      data.forEach(item => results.add(item.word));
    } catch (e) {}

    const filtered = [...results].filter(w =>
      typeof w === 'string' &&
      w.trim().length >= 3 &&
      w.toLowerCase() !== stem.toLowerCase() &&
      w.toLowerCase() !== word.toLowerCase() &&
      /^[а-яё\- ]+$/i.test(w)
    );

    const seen = new Set();
    const unique = [];
    for (const w of filtered) {
      const key = w.toLowerCase();
      if (!seen.has(key)) {
        seen.add(key);
        unique.push(w);
      }
    }
    return unique.slice(0, 25);
  }

  /* ============ ПОПАП СИНОНИМОВ ============ */
  async function onWordClick(e) {
    e.stopPropagation();
    const el = e.currentTarget;
    const word = el.dataset.word;
    const stem = el.dataset.stem;
    const tokenIdx = parseInt(el.dataset.tokenIdx, 10);

    popupWord.textContent = `Синонимы для «${word}»`;

    const rect = el.getBoundingClientRect();
    popup.style.display = 'block';
    const popupW = 300;
    const left = Math.max(12, Math.min(rect.left, window.innerWidth - popupW - 12));
    popup.style.top = (rect.bottom + 8) + 'px';
    popup.style.left = left + 'px';

    let synonyms;
    if (synonymCache.has(stem)) {
      synonyms = synonymCache.get(stem);
    } else {
      popupList.innerHTML = '<div class="loading">Ищу варианты…</div>';
      synonyms = await fetchSynonyms(stem, word);
      synonymCache.set(stem, synonyms);
    }

    if (synonyms.length === 0) {
      popupList.innerHTML = '<div class="empty">Ничего не нашлось 😕</div>';
      return;
    }

    popupList.innerHTML = synonyms.map(s =>
      `<span class="syn-item" data-replace="${escapeAttr(s)}">${escapeHtml(s)}</span>`
    ).join('') +
    `<span class="syn-item syn-add" title="Добавить свой синоним">+ своё</span>`;

    popupList.querySelectorAll('.syn-item').forEach(item => {
      if (item.classList.contains('syn-add')) {
        item.addEventListener('click', () => {
          const custom = prompt(`Свой синоним для «${word}»:`);
          if (custom && custom.trim().length >= 2) {
            const trimmed = custom.trim();
            saveUserSynonym(word, trimmed);
            if (!synonyms.includes(trimmed)) synonyms.unshift(trimmed);
            synonymCache.set(stem, synonyms);
            onWordClick({ currentTarget: el, stopPropagation: () => {} });
          }
        });
      } else {
        item.addEventListener('click', () => {
          applyReplacement(tokenIdx, word, item.dataset.replace);
          hidePopup();
        });
      }
    });
  }

  /* ============ ЗАМЕНА ============ */
  function applyReplacement(tokenIdx, oldWord, newWord) {
    const tokens = currentTokens;
    if (!tokens[tokenIdx] || tokens[tokenIdx].type !== 'word') return;
    let newText = '';
    tokens.forEach((t, i) => {
      if (i === tokenIdx) newText += newWord;
      else newText += t.text;
    });
    input.value = newText;
    safeAnalyze();
  }

  function hidePopup() { popup.style.display = 'none'; }

  document.addEventListener('click', (e) => {
    if (!popup.contains(e.target) && !e.target.classList.contains('repeat')) {
      hidePopup();
    }
  });

  /* ============ КНОПКИ ============ */
  function clearAll() {
    input.value = '';
    preview.innerHTML = '';
    repeatsList.innerHTML = '<div class="empty-state">Введите текст.</div>';
    statsEl.textContent = '';
    currentPairs = [];
    currentTokens = [];
    hidePopup();
    showToast('Очищено');
  }

  async function copyText() {
    const text = input.value;
    if (!text) { showToast('Нечего копировать'); return; }
    try {
      await navigator.clipboard.writeText(text);
      showToast('✅ Скопировано');
    } catch (err) {
      try {
        input.select();
        document.execCommand('copy');
        window.getSelection().removeAllRanges();
        showToast('✅ Скопировано');
      } catch (e) {
        showToast('⚠️ Не удалось скопировать');
      }
    }
  }

  /* ============ СОБЫТИЯ ============ */
  $('btn-check').addEventListener('click', safeAnalyze);
  $('btn-copy').addEventListener('click', copyText);
  $('btn-clear').addEventListener('click', clearAll);
  themeBtn.addEventListener('click', toggleTheme);

  distanceEl.addEventListener('input', () => {
    distanceVal.textContent = distanceEl.value;
    safeAnalyze();
  });
  distanceVal.textContent = distanceEl.value;

  let inputTimer = null;
  input.addEventListener('input', () => {
    clearTimeout(inputTimer);
    inputTimer = setTimeout(safeAnalyze, 300);
  });

  /* ============ СТАРТ ============ */
  loadAbramovDictionary();
  safeAnalyze();
})();
</script>
